# Fan curve applied to the EC at boot by zimacube-fan-curve.service.
#
# The EC keeps running the control loop; these are only its parameters, re-read on
# every tick. Duty is 0..255.
#
#   duty = START_PWM + (temp - START_TEMP) * SLOPE,  forced to 255 at FULL_TEMP
#
# The EC temperature tracks the real one while rising and lags a few degrees high
# while falling, so set these against real temperatures. Note the duty ramps by
# one step per control tick, so the fans take a while to settle after a spike.
#
# Leave a value empty to keep whatever BIOS wrote.
#
# BIOS Setup can only express START_PWM <= 122 and SLOPE <= 7; both are plain
# bytes, so higher values work here.
#
# Factory values, for reference:
#   CPU  start 40 C, pwm 60, slope 5, full 90 C   (reaches 255 at 79 C)
#   SYS  start 25 C, pwm 60, slope 3, full 80 C
#
# The defaults below are deliberately close to stock -- slightly earlier and
# slightly steeper -- so that enabling the service is a small, verifiable change
# rather than a thermal experiment. Tune from here.

# CPU fan: 90/255 at 47 C, 228 at 70 C, full by ~75 C
CPU_START_TEMP=42
CPU_START_PWM=60
CPU_SLOPE=6
CPU_FULL_TEMP=85

# System fan: drives the drive bays, keep air moving earlier
SYS_START_TEMP=28
SYS_START_PWM=60
SYS_SLOPE=4
SYS_FULL_TEMP=78
